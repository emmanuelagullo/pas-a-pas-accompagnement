<div class="frise-outils{% if frises_actives %} frise-active{% endif %}" data-frise-outils>
<form method="post" action="{% url 'dossiers:frises_preference' %}" class="frise-choix" data-frise-choix>{% csrf_token %}<input type="hidden" name="retour_frise" value="{{ frise_retour }}"><label class="frise-libelle-aide" data-frise-explication><input aria-description="Afficher la frise chronologique" type="checkbox" name="actif" value="1"{% if frises_actives %} checked{% endif %}> Frise<span class="frise-explication" aria-hidden="true">Afficher la frise chronologique</span></label><button class="secondaire">Appliquer</button></form>
<details class="frise-aide" data-frise-aide{% if not frises_actives %} hidden{% endif %}><summary>Légende</summary><div>{% if legende_objectifs %}{% include 'frises/_legende_objectifs.html' %}{% elif legende_elements %}Chaque point indique la date du fait. Les textes et les éléments restent les mêmes avec ou sans frise.{% else %}{% include 'frises/_legende.html' %}{% endif %}</div></details>
</div>
