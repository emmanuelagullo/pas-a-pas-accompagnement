{% if bande %}<span class="frise-mini{% if bande.recouvrement %} frise-recouvrement{% endif %}" role="img" aria-label="Périodes consultables : {{ bande.description|default:'prestations détaillées ci-dessous' }}{% if bande.dense %}. Plusieurs prestations ; élargir pour les détails{% if bande.approximative %} ; périodes regroupées dans le dessin ; dates exactes dans les détails{% endif %}{% endif %}{% if bande.futur %}. Informations futures disponibles dans les détails{% endif %}{% if bande.recouvrement %}. Recouvrement de prises en charge à examiner{% endif %}">{% for segment in bande.segments %}<i aria-hidden="true"{% if segment.point %} data-frise-point="1"{% endif %} class="frise-marque frise-{{ segment.type }}{% if segment.dense %} frise-dense{% endif %}" style="left:{{ segment.x }}%;width:{{ segment.w }}%;--piste:{{ segment.lane }}"></i>{% endfor %}{% if bande.dense %}<b class="frise-signal" aria-hidden="true">≋</b>{% endif %}{% if bande.futur %}<b class="frise-futur" aria-label="Prévisions ou périodes futures à consulter dans les détails">›</b>{% endif %}</span>{% endif %}
