name: Authentification CHRS
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verifier:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        django: ['5.2.18', '6.1.1']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Installer les profils et tester les parcours fictifs
        env:
          DJANGO_TEST_VERSION: ${{ matrix.django }}
        run: |
          python -m pip install -r requirements.lock -r requirements-2fa.txt
          python -m pip install "Django==$DJANGO_TEST_VERSION"
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py test
          python scripts/verifier-authentification.py
          python -m pip check
