name: Authentification CHRS
on:
  push:
    branches: [main]
    tags: ['[0-9]*']
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read
jobs:
  verifier:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        django: ['5.2.18', '6.1.1']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Installer les profils et tester les parcours fictifs
        env:
          DJANGO_TEST_VERSION: ${{ matrix.django }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0
          python -m pip install -r requirements-serveur.txt -r requirements-2fa.txt
          python -m pip install "Django==$DJANGO_TEST_VERSION"
          python -m pas_communs.ci django --controle scripts/verifier-profil-serveur.py --controle scripts/verifier-authentification.py --controle scripts/test-manifeste-publication.py --pip-check
