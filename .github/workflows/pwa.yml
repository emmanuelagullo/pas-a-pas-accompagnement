name: PWA fictive Pas à Pas

on:
  push:
    branches: [main]
    tags: ['[0-9]*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: python -m pip install -r requirements.lock
      - run: npm ci --prefix pwa
      - run: npx --prefix pwa playwright install --with-deps chromium
      - run: python scripts/construire-pwa.py --test
      - run: node scripts/verifier-pwa-pyodide.mjs
      - run: node scripts/verifier-pwa.cjs
        env:
          PWA_TEST_HTTPS: oui
      - run: node scripts/verifier-pwa.cjs
        env:
          PWA_BASE_PATH: /
      - run: python scripts/construire-pwa.py --sortie dist/pwa-production --runtime dist/pwa/runtime --wheels dist/pwa/wheels
      - run: node scripts/verifier-pwa.cjs
        env:
          PWA_BUNDLE: dist/pwa-production
          PWA_PRODUCTION: oui
      - name: Préparer et vérifier le candidat normal sans publication
        run: |
          python scripts/manifeste-publication.py --mode navigateur --target chromium-statique --bundle dist/pwa-production --destination dist/publication-pwa.json
          python scripts/manifeste-publication.py --verifier dist/publication-pwa.json --mode navigateur --target chromium-statique
      - uses: actions/upload-artifact@v6
        with:
          name: pwa-fictive-normale-sans-publication
          path: |
            dist/PasAPasAccompagnement-pwa.zip
            dist/publication-pwa.json
            dist/notes-version.md
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v6
        with:
          name: pwa-fictive-test-ne-pas-publier
          path: dist/pwa/
          if-no-files-found: error
          retention-days: 7
