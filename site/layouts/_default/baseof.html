<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ if not .IsHome }}{{ .Title }} · {{ end }}{{ site.Title }}</title>
<meta name="description" content="{{ .Description | default site.Params.description }}">
<link rel="canonical" href="{{ .Permalink }}">
<link rel="stylesheet" href="{{ "css/site.css" | relURL }}">
</head>
<body>
<a class="evitement" href="#contenu">Aller au contenu</a>
<header><a class="marque" href="{{ site.Home.RelPermalink }}">Pas à Pas <span>Accompagnement</span></a>
<nav aria-label="Navigation principale"><a href="{{ "essayer/" | relURL }}">Essayer</a><a href="{{ "premiers-pas/" | relURL }}">Premiers pas</a><a href="{{ "le-projet/" | relURL }}">Le projet</a></nav></header>
<main id="contenu">{{ block "main" . }}{{ end }}</main>
<footer><p>Logiciel libre · AGPL-3.0-or-later · <a href="{{ site.Params.repository }}">Code et documentation technique</a></p>
<p>Prototype sur données fictives uniquement.</p></footer>
</body></html>
