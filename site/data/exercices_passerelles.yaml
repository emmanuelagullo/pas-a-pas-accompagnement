- titre: Accueillir sans fabriquer de faits
  texte: '**Inès** a une demande acceptée, mais pas de ménage ni de prise en charge. Ouvrir sa demande puis préparer
    l''ouverture liée ; vérifier bénéficiaires et ménage avant de confirmer. **Résultat attendu :** l''acceptation
    seule n''avait créé ni séjour ni repas. Voir [demande et admission](../accueillir/demande/).


    Les **deux Robin** sont des homonymes distincts. Retrouver chacun et comparer leur identité et leur historique
    sans les fusionner. Chez **Yannis**, la naissance imprécise ne doit pas devenir une date exacte pour calculer
    un âge.'
  id: accueillir-sans-fabriquer-de-faits
- titre: Lire plusieurs prises en charge et une histoire personnelle
  texte: 'Ouvrir **Noor**, puis comparer sa reprise et ses anciennes périodes. Plusieurs dossiers comportent jusqu''à
    cinq prises en charge, chacune avec plusieurs prestations. **Noé** change de ménage ; vérifier que les bénéficiaires
    des anciennes prises restent inchangés.


    Chez **Thomas**, comparer nouvelle adresse et correction d''un complément. Observer les dates d''effet et d''enregistrement,
    puis retrouver le retour au dossier. Voir [situation datée](../dossier/situation/) et [corrections](../corriger-saisie/).'
  id: lire-plusieurs-prises-en-charge-et-une-histoire-personnelle
- titre: Ressources, droits et besoins pratiques
  texte: 'Chez **Samira**, comparer plusieurs ressources et la correction d''une dette. Chez **Maïa**, une absence
    confirmée remplace les anciennes ressources : elle diffère d''un dossier non renseigné. Les échéances administratives
    dépassées de **Thomas** restent des informations à vérifier, sans fin automatique.


    Chez **Noor**, lire le besoin de plain-pied corrigé, l''antécédent institutionnel sans dates inventées et les
    deux versions du document joint. Télécharger l''ancienne version ; vérifier que le titre corrigé n''a pas effacé
    son histoire. Le ménage de Samira conserve aussi un brouillon annulé. Voir [documents joints](../dossier/documents-joints/).


    Chez Noor, **Itinéraire et antécédents** montre une ancienneté de deux ans déclarés dans une agglomération fictive,
    sans date d’arrivée inventée, et une reprise déclarée de démarches. La qualification d’évolution ne modifie
    pas les situations personnelles.'
  id: ressources-droits-et-besoins-pratiques
- titre: Prestations et mouvements
  texte: 'Avec **Samira**, comparer les deux lieux successifs et l''absence close du séjour. Avec **Gabriel et Éva**,
    lire le séjour terminé en logement diffus. **Résultat attendu :** changement de lieu, retour d''absence et nouvelle
    admission sont différents.


    Comparer ensuite la remise de cartes corrigée de **Samira**, la remise annulée de **Thomas**, les produits en
    kg de **Yannis** et l''accueil de jour de **Noor**. Un bon remis ne prouve pas son utilisation ; l''accueil
    de jour n''ajoute aucune nuitée. Voir [autres prestations](../prestations/autres-prestations/).'
  id: prestations-et-mouvements
- titre: Financement, transmissions et appels
  texte: 'Depuis une prestation disposant d''un calcul, comparer phases, version du tarif, financeurs et document
    émis. Modifier un calcul fictif puis vérifier que le contenu du document déjà émis reste identique. Voir [financer
    une prestation](../prestations/financement/).


    Dans **Travail du jour**, lire les transmissions puis les actions explicitement en attente. Marquer uniquement
    une action fictive effectivement réalisée. Ouvrir les **Appels 115** : le jeu neuf en propose quinze, avec anonymat,
    suites et réponses variées. Un appel ne doit créer aucune admission implicite. Voir [appels 115](../accueillir/appel115/).'
  id: financement-transmissions-et-appels
- titre: Retrouver un chiffre et son origine
  texte: 'Sur un jeu neuf non modifié, choisir **J−60 à J+1**, J étant la date de génération : **215 nuitées théoriques**,
    **209 nuits hors absences déclarées** et **8 repas distribués**. Les prises anciennes augmentent le jeu total
    sans toutes appartenir à cette fenêtre. Dans un espace partagé ou déjà modifié, ne pas attendre ces mêmes chiffres.


    Avec **Nadia**, recalculer son modèle comparant nuitées totales et ventilation par âge à chaque nuit. Ouvrir
    un relevé détaillé puis un dossier ; retrouver les critères grâce au retour au rapport. Un modèle est personnel
    et les résultats se recalculent sous les droits actuels. Voir [explorer](../analyser/explorer/).


    Pour signaler un écart, indiquer version, espace neuf ou modifié, période et exercice. Garder toutes les informations
    fictives.


    Dans l’explorateur, comparer premier/dernier objet filtré et activer les sous-totaux pour contrôler les effectifs
    distincts.'
  id: retrouver-un-chiffre-et-son-origine
- titre: Annuler une arrivée ou préparer un petit-déjeuner
  texte: 'Chez **Robin A**, consulter l’arrivée annulée, son lieu et son motif de retrait. L’annulation distincte
    de l’autorisation reste visible. Les compteurs de référence excluent cette arrivée.


    Dans les repas du ménage de **Samira**, essayer la préparation du petit-déjeuner sans enregistrer, puis vérifier
    les personnes proposées et les informations inconnues. Le transport du paramétrage se teste dans un autre espace
    fictif, après aperçu des homonymes.


    Voir [reprendre une arrivée](../depannage/arrivee-erronee/), [préparer le petit-déjeuner](../prestations/petit-dejeuner/)
    et [transporter le paramétrage](../equipe/parametrage/).'
  id: annuler-une-arrivée-ou-préparer-un-petit-déjeuner
