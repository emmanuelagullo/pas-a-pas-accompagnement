image: python:3.12-slim

# Même sélection de runners que Petits Pas pour les contrôles ordinaires.
default:
  tags:
    - ci.inria.fr
    - small

stages: [test, integration, construction, publication]

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: '$CI_COMMIT_TAG =~ /^[0-9]+\.[0-9]+(\.[0-9]+)?(-[A-Za-z0-9.-]+)?$/'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'
test:
  stage: test
  parallel:
    matrix:
      - VERSION_PYTHON: ['3.12', '3.13']
        DJANGO_TEST_VERSION: ['5.2.18', '6.1.1']
  image: python:${VERSION_PYTHON}-slim
  script:
    - apt-get update
    - apt-get install --yes --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0
    - python -m pip install -r requirements-serveur.txt -r requirements-2fa.txt
    - python -m pip install "Django==$DJANGO_TEST_VERSION"
    - python -m unittest discover -s scripts -p test_version_application.py
    - python -m unittest discover -s scripts -p test_publication_automatique.py
    - python -m unittest discover -s scripts -p test_canal_pwa.py
    - python -m unittest discover -s scripts -p test_qualification_postgresql.py
    - python -m pas_communs.ci django --migrer --controle scripts/verifier-profil-serveur.py --controle scripts/verifier-authentification.py --controle scripts/test-manifeste-publication.py --controle scripts/verifier-demonstration.py --pip-check


qualification-postgresql:
  stage: test
  image: python:${VERSION_PYTHON}-slim-trixie
  parallel:
    matrix:
      - VERSION_PYTHON: ['3.12', '3.13']
        DJANGO_TEST_VERSION: ['5.2.18', '6.1.1']
  services:
    - name: postgres:17-alpine
      alias: postgresql
  variables:
    POSTGRES_DB: postgres
    POSTGRES_USER: qualification
    POSTGRES_PASSWORD: fictif-ci-seulement
    PGHOST: postgresql
    PGPORT: '5432'
    PGUSER: qualification
    PGPASSWORD: fictif-ci-seulement
    ACCOMPAGNEMENT_PG_QUALIFICATION: 'oui'
  script:
    - apt-get update
    - apt-get install --yes --no-install-recommends postgresql-client libpq5 libpango-1.0-0 libpangoft2-1.0-0
    - python -m pip install -r requirements-serveur.txt -r requirements-2fa.txt -r requirements-tests-postgresql.txt
    - python -m pip install "Django==$DJANGO_TEST_VERSION"
    - python -m pip check
    - python scripts/qualifier-postgresql.py


deploiement-ephemere:
  stage: integration
  tags: [ci.inria.fr, medium]
  before_script:
    - apt-get update
    - apt-get install --yes --no-install-recommends git
    - apt-get update
    - apt-get install --yes --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0
    - python -m pip install -r requirements-serveur.txt -r requirements-2fa.txt
  script:
    - bash -n start-render.sh start-persistent.sh
    - python -m unittest discover -s scripts -p test_configuration_render.py
    - python -m unittest discover -s scripts -p test_deploiement_attente.py
    - python scripts/exercer-deploiement.py ephemere --render
    - python -m unittest discover -s scripts -p 'test_publication*.py'

deploiement-persistant-local:
  stage: integration
  before_script:
    - apt-get update
    - apt-get install --yes --no-install-recommends git
    - apt-get update
    - apt-get install --yes --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0
    - python -m pip install -r requirements-serveur.txt -r requirements-2fa.txt
  script:
    - python scripts/exercer-deploiement.py persistant

pwa-prototype:
  stage: construction
  image: python:3.12-slim-trixie
  tags: [ci.inria.fr, medium]
  before_script:
    - apt-get update
    - apt-get install --yes --no-install-recommends nodejs npm openssl
    - python --version
    - python -m pip install -r requirements.lock
    - npm ci --prefix pwa
    - npx --prefix pwa playwright install --with-deps chromium
  script:
    - python -m unittest discover -s scripts -p test_construire_pwa.py
    - python scripts/construire-pwa.py --test
    - node scripts/verifier-recherche-dossiers.cjs
    - node scripts/verifier-nouveau-menage.cjs
    - node scripts/verifier-editeur-textes.cjs
    - node scripts/verifier-pwa-pyodide.mjs
    - PWA_TEST_HTTPS=oui node scripts/verifier-pwa.cjs
    - PWA_BASE_PATH=/ node scripts/verifier-pwa.cjs
    - python scripts/construire-pwa.py --sortie dist/pwa-production --runtime dist/pwa/runtime --wheels dist/pwa/wheels
    - PWA_BUNDLE=dist/pwa-production PWA_PRODUCTION=oui node scripts/verifier-pwa.cjs
    - python scripts/manifeste-publication.py --mode navigateur --target chromium-statique --bundle dist/pwa-production --destination dist/publication-pwa.json
    - python scripts/manifeste-publication.py --verifier dist/publication-pwa.json --mode navigateur --target chromium-statique
  artifacts:
    paths:
      - dist/PasAPasAccompagnement-pwa.zip
      - dist/publication-pwa.json
      - dist/notes-version.md
    expire_in: 30 days

publier-pwa:
  stage: publication
  resource_group: publication-pwa
  needs:
    - job: test
      artifacts: false
    - job: deploiement-ephemere
      artifacts: false
    - job: deploiement-persistant-local
      artifacts: false
    - job: qualification-postgresql
      artifacts: false
    - job: pwa-prototype
      artifacts: false
  inherit:
    default: false
    variables: false
  rules:
    - if: '$CI_COMMIT_TAG =~ /^[0-9]+\.[0-9]+(\.[0-9]+)?$/'
      when: on_success
      allow_failure: false
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: true
    - when: never
  variables:
    PWA_SOURCE_PROJECT: $CI_PROJECT_PATH
    PWA_SOURCE_PROJECT_ID: $CI_PROJECT_ID
    PWA_SOURCE_PIPELINE_ID: $CI_PIPELINE_ID
    PWA_SOURCE_SHA: $CI_COMMIT_SHA
    PWA_SOURCE_REF: $CI_COMMIT_REF_NAME
    PWA_SOURCE_TAG: $CI_COMMIT_TAG
  trigger:
    project: pas-a-pas-accompagnement/pas-a-pas-accompagnement-pwa
    branch: main
    strategy: depend
    forward:
      yaml_variables: true
      pipeline_variables: false

# Destination et secret fournis par l'exploitant ; aucun hook dans le dépôt.
deployer-demonstration:
  stage: publication
  resource_group: demonstration
  rules:
    - if: '$DEMO_DEPLOY_HOOK && $DEMO_HEALTH_URL && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: true
    - when: never
  environment:
    name: demonstration-fictive
  script:
    - python scripts/deployer-demonstration.py

# Captures exclusivement depuis un serveur jetable initialisé avec Les Passerelles.
captures-demonstration:
  extends: .site-public-rules
  stage: test
  image:
    name: mcr.microsoft.com/playwright/python@sha256:72bd171a9ffc2b4b59532aaa6210e21014d07093120dc25528870c0b840da1f0
    entrypoint: [""]
  variables:
    PORT: "8000"
  before_script:
    - python3 -m pip install -r requirements-serveur.txt -r requirements-2fa.txt "playwright==1.63.0"
  script:
    - test -z "${DATABASE_URL:-}" && test -z "${ACCOMPAGNEMENT_DONNEES:-}"
    - |
      if ! python3 scripts/capturer-site-chrs.py --demarrer-serveur --output site/static/captures; then
        echo '=== Journal du serveur fictif ===' >&2
        tail -100 .ci-captures-chrs.log >&2
        exit 1
      fi
      if ! python3 manage.py test personnes.qualification_navigateur acteurs.qualification_navigateur --noinput >.ci-qualification-navigateur.log 2>&1; then
        echo '=== Échec de la qualification navigateur par profils ===' >&2
        cat .ci-qualification-navigateur.log >&2
        tail -100 .ci-captures-chrs.log >&2
        exit 1
      fi
      cat .ci-qualification-navigateur.log
  artifacts:
    when: always
    paths: [site/static/captures, .ci-captures-chrs.log, .ci-qualification-navigateur.log]
    expire_in: 7 days

# Le contenu vit dans ce dépôt, comme le site Hugo Petits Pas.
.site-public-rules:
  rules:
    - changes:
        - .gitlab-ci.yml
        - .gitmodules
        - site/**/*
        - scripts/verifier-site-public.py
        - scripts/capturer-site-chrs.py
        - pas_a_pas_accompagnement/demo.py
        - personnes/statistiques.py
        - personnes/templates/**/*
        - start-render.sh
        - requirements-serveur.txt
        - requirements-2fa.txt
        - pas_a_pas_accompagnement/**/*
        - personnes/**/*
        - identites/**/*
        - templates/**/*
        - static/**/*
    - when: never

site-public:
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
  extends: .site-public-rules
  stage: construction
  needs:
    - job: captures-demonstration
      artifacts: true
  interruptible: true
  image:
    name: registry.gitlab.com/pages/hugo/hugo_extended@sha256:ff07c15f0ff5876c7a737d07b906d48802e7fcd1bba02f648fae63fda57ddb56
    entrypoint: [""]
  script:
    - hugo version
    - hugo --source site --baseURL "$CI_PAGES_URL/" --cleanDestinationDir --minify --panicOnWarning
  artifacts:
    paths: [site/public]
    expire_in: 7 days

pages:
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
  stage: publication
  needs:
    - job: site-public
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - .gitlab-ci.yml
        - .gitmodules
        - site/**/*
        - scripts/verifier-site-public.py
        - scripts/capturer-site-chrs.py
        - pas_a_pas_accompagnement/demo.py
        - personnes/statistiques.py
        - personnes/templates/**/*
        - start-render.sh
        - requirements-serveur.txt
        - requirements-2fa.txt
        - pas_a_pas_accompagnement/**/*
        - personnes/**/*
        - identites/**/*
        - templates/**/*
        - static/**/*
    - when: never
  script:
    - python scripts/verifier-site-public.py --sortie site/public --base-url "$CI_PAGES_URL/"
  pages:
    publish: site/public
  artifacts:
    paths: [site/public]
    expire_in: 30 days
  environment:
    name: site-public
    url: $CI_PAGES_URL
