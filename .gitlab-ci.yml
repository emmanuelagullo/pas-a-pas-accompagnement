image: python:3.12-slim
stages: [test]
test:
  stage: test
  parallel:
    matrix:
      - VERSION_PYTHON: ['3.12', '3.13']
        DJANGO_TEST_VERSION: ['5.2.18', '6.1.1']
  image: python:${VERSION_PYTHON}-slim
  script:
    - python -m pip install -r requirements-serveur.txt -r requirements-2fa.txt
    - python -m pip install "Django==$DJANGO_TEST_VERSION"
    - python -m pas_communs.ci django --migrer --controle scripts/verifier-profil-serveur.py --controle scripts/verifier-authentification.py --controle scripts/test-manifeste-publication.py --pip-check
